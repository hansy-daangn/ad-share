footer{margin-top:40px;color:var(--muted);font-size:12px;text-align:center}
@media (max-width:820px){.lb{grid-template-columns:1fr}.side{display:none}.wrap{padding:20px 16px 40px}}

var PLAY='<svg viewBox="0 0 24 24"><path d="M7 4.5v15l13-7.5z"/></svg>';

function days(a){return a.start?Math.max(1,Math.floor((Date.now()/1000-a.start)/86400)+1):null}

 return '<div class="tile" data-i="'+i+'">'+inner+(x.a.rank&&DETAIL?'<span class="bd">노출 #'+x.a.rank+'</span>':'')+'</div>'}
function render(){LIST=items();var g=document.getElementById('grid');
 document.getElementById('meta').textContent='광고 '+DATA.length+' · 소재 '+LIST.length;
 g.innerHTML=LIST.map(function(x,i){if(!DETAIL)return tile(x,i);var a=x.a,d=days(a);
  return '<div class="card">'+tile(x,i)+'<div class="info"><div class="pn">'+e(a.page)+'</div><div class="mt">'+(a.rank?'노출 #'+a.rank+' · ':'')+(d?d+'일째':'')+'</div>'+(a.body?'<div class="tx">'+e(a.body)+'</div>':'')+(a.note?'<div class="nt">'+e(a.note)+'</div>':'')+'</div></div>'}).join('')}

function open(i){IDX=i;var lb=document.getElementById('lb');lb.hidden=false;draw()}

 lb.innerHTML='<div class="stage"><button class="x" data-k="x">✕</button>'+(LIST.length>1?'<button class="nav l" data-k="p">‹</button><button class="nav r" data-k="n">›</button><div class="pos">'+(IDX+1)+' / '+LIST.length+'</div>':'')+media+'</div>'+
 '<div class="side"><div class="pn">'+e(a.page)+'</div><div class="chips">'+(a.rank?'<span class="chip acc">노출 #'+a.rank+(a.query?' · '+e(a.query):'')+'</span>':'')+(d?'<span class="chip">'+d+'일째 게재</span>':'')+(a.dup>1?'<span class="chip">복제 ×'+a.dup+'</span>':'')+'</div>'+
 '<a class="dl" href="'+f.src+'" download>'+(f.type==='video'?'영상':'이미지')+' 다운로드</a>'+
 (a.note?'<div class="nt" style="margin:0">'+e(a.note)+'</div>':'')+(a.title?'<div style="font-weight:700">'+e(a.title)+'</div>':'')+(a.body?'<div class="body">'+e(a.body)+'</div>':'')+
